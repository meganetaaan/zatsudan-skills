name: zatsudan-mcp

on:
  push:
    branches: [main]
    paths:
      - "zatsudan-mcp/**"
      - ".github/workflows/zatsudan-mcp.yml"
  pull_request:
    paths:
      - "zatsudan-mcp/**"
      - ".github/workflows/zatsudan-mcp.yml"

# 同一ブランチの多重実行を抑止（デプロイの競合防止）。
concurrency:
  group: zatsudan-mcp-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: zatsudan-mcp

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: zatsudan-mcp/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  deploy:
    # main への push のときだけデプロイ（PR ではデプロイしない）。
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: zatsudan-mcp/package-lock.json
      - run: npm ci
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: zatsudan-mcp
          command: deploy
          # Worker 側の Bearer token を secret として同期する。
          # ZATSUDAN_API_KEY を未設定にすれば認証なしでデプロイされる。
          secrets: |
            ZATSUDAN_API_KEY
        env:
          ZATSUDAN_API_KEY: ${{ secrets.ZATSUDAN_API_KEY }}
